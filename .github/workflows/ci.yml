name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip

      - name: Run route count mismatch checker
        run: |
          python3 scripts/check_count_mismatch.py

      - name: Lua syntax check (luac)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lua5.1
          # prefer luac5.1 if available, fall back to luac
          if command -v luac5.1 >/dev/null 2>&1; then EXE=luac5.1; elif command -v luac >/dev/null 2>&1; then EXE=luac; else EXE=; fi
          if [ -n "$EXE" ]; then
            echo "Using $EXE to syntax-check Lua files"
            # Fail the job if any lua file has syntax errors
            find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 $EXE -p
          else
            echo "luac not found on runner; skipping lua syntax check"
          fi
