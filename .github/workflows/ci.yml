name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip

      - name: Run route count mismatch checker
        run: |
          if [ -f scripts/check_count_mismatch.py ]; then
            echo "Running scripts/check_count_mismatch.py"
            python3 scripts/check_count_mismatch.py
          else
            echo "scripts/check_count_mismatch.py not found; skipping route count mismatch check"
          fi

      - name: Lua syntax check (luac)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lua5.1
          # prefer luac5.1 if available, fall back to luac
          if command -v luac5.1 >/dev/null 2>&1; then EXE=luac5.1; elif command -v luac >/dev/null 2>&1; then EXE=luac; else EXE=; fi
          if [ -n "$EXE" ]; then
            echo "Using $EXE to syntax-check Lua files"
            # Fail the job if any lua file has syntax errors
            find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 $EXE -p
          else
            echo "luac not found on runner; skipping lua syntax check"
          fi

      - name: Install luacheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck || true

      - name: Run luacheck
        run: |
          if command -v luacheck >/dev/null 2>&1; then
            echo "Running luacheck with .luacheckrc"
            # fail the job if luacheck returns non-zero
            luacheck --config .luacheckrc . || exit $?
          else
            echo "luacheck not available; skipping"
          fi
